<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dikapei Culinary Institution Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: white;">

  <!-- Centered Container -->
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <!-- Login Card -->
    <div class="card shadow p-4" style="width: 350px; border-radius: 10px;">
      
      <!-- Logo on Top -->
      <div class="text-center mb-3">
        <img src="logo.jpg" alt="Website Logo" width="120" height="100">
      </div>
      
      <!-- Title -->
      <h4 class="text-center mb-4" style="color: orangered;">Student Login</h4>
      
      <!-- Login Form -->
      <form>
        <div class="mb-3">
          <label for="email" class="form-label" style="color: orangered;">Email / Username</label>
          <input type="text" class="form-control" id="email" placeholder="Enter your email">
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label" style="color: orangered;">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password">
        </div>
        
        <button type="submit" class="btn w-100" style="background-color: orangered; color: white; border: none;">
          Login
        </button>
        
        <div class="text-center mt-3">
          <a href="#" style="color: orangered;">Forgot Password?</a>
        </div>
      </form>
      
      <!-- Footer -->
      <div class="text-center mt-4">
        <small style="color: orangered;">Not registered? <a href="applications.html" style="color: orangered;">Apply Now</a></small>
      </div>
    </div>
  </div>

</body>

</html>

<script>
  function goHome(event) {
    event.preventDefault(); // stop default form action
    window.location.href = "home.html"; // redirect to home page
  }
</script>

<form onsubmit="goHome(event)">
  <input type="text" placeholder="Email">
  <input type="password" placeholder="Password">
  <button type="submit">Login</button>
</form>
